<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leadership Coach Bot</title>
    <style>
      body { font-family: Arial, sans-serif; max-width: 800px; margin: 2rem auto; }
      #chat { border: 1px solid #ccc; border-radius: 8px; padding: 12px; height: 320px; overflow-y: auto; }
      .msg { margin: 8px 0; }
      .user { color: #0b5; }
      .assistant { color: #333; }
      form { display: flex; gap: 8px; margin-top: 12px; }
      input { flex: 1; padding: 8px; }
    </style>
  </head>
  <body>
    <h1>Leadership Coach Chat</h1>
    <div id="chat"></div>
    <form id="form">
      <input id="text" placeholder="Schreibe deine Frage..." required />
      <button>Senden</button>
    </form>

    <script>
      const chat = document.getElementById('chat');
      const form = document.getElementById('form');
      const textInput = document.getElementById('text');
      const orgId = 'demo-org';
      const userHandle = 'web-user';

      function append(role, text) {
        const div = document.createElement('div');
        div.className = `msg ${role}`;
        div.textContent = `${role === 'user' ? 'Du' : 'Coach'}: ${text}`;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = textInput.value.trim();
        if (!text) return;
        append('user', text);
        textInput.value = '';

        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ org_id: orgId, user_handle: userHandle, text })
        });
        const data = await res.json();
        append('assistant', data.reply || data.error || 'Keine Antwort');
      });
    </script>
  </body>
</html>
